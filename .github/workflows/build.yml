name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Системные пакеты
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev build-essential ccache

      - name: Установка Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "cython<3.1" setuptools

      - name: Кэш сборки
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Сборка APK
        run: yes | buildozer android debug > build.log 2>&1

      - name: Конец лога при ошибке
        if: failure()
        run: tail -n 60 build.log

      - uses: actions/upload-artifact@v4
        with:
          name: school-helper-apk
          path: bin/*.apk
